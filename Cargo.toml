[package]
name = "loghaven"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "loghaven"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
colored = "3.0.0"
dirs = "6.0.0"
nix = { version = "0.30.1", features = ["process", "signal"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full", "net"] }
toml = "0.9.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
