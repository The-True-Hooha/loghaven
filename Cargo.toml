[package]
name = "loghaven"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "loghaven"
path = "src/main.rs"

[dependencies]
arrow = "59"
aws-sdk-s3 = "1"
clap = { version = "4", features = ["derive"] }
colored = "3"
dirs = "6"
nix = { version = "0.30", features = ["process", "signal"] }
parquet = { version = "59", features = ["arrow", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["full", "net", "rt-multi-thread", "sync"] }
toml = "0.9"
uuid = { version = "1", features = ["v7"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
