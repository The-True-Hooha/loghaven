[package]
name = "loghaven"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "loghaven"
path = "src/main.rs"

[dependencies]
arrow = "59"
aws-sdk-s3 = "1"
rmp-serde = "1"
clap = { version = "4", features = ["derive"] }
colored = "3"
dirs = "6"
nix = { version = "0.30", features = ["process", "signal"] }
parquet = { version = "59", features = ["arrow", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full", "net", "rt-multi-thread", "sync"] }
toml = "0.9"
uuid = { version = "1", features = ["v7"] }
jsonwebtoken = "9"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
rsa = { version = "0.9", features = ["pem"] }
hex = "0.4"
axum = "0.8"
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
ratatui = "0.30"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
