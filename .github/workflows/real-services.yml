name: Real services

# Runs the suites in scripts/realtests against real server software in containers: the S3 API
# (MinIO, RustFS), Azure (Azurite), SFTP (OpenSSH), WebDAV (Apache), Ethereum (Anvil), Stellar
# (stellar/quickstart) and Solana (Agave test validator). Started by hand, or by a change to the
# suites themselves.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/realtests/**"
      - ".github/workflows/real-services.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  stores:
    name: Stores
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      - name: A 100 MiB chunk
        run: LH_BIG_CHUNK=/tmp/big.parquet LH_BIG_CHUNK_MB=100 cargo test make_big_chunk -- --ignored --nocapture
      - name: MinIO
        run: scripts/realtests/s3.sh minio target/debug/loghaven /tmp/big.parquet
      - name: RustFS
        run: scripts/realtests/s3.sh rustfs target/debug/loghaven /tmp/big.parquet
      - name: Azurite
        run: scripts/realtests/azure.sh target/debug/loghaven /tmp/big.parquet
      - name: SFTP
        run: scripts/realtests/sftp.sh target/debug/loghaven /tmp/big.parquet
      - name: WebDAV
        run: scripts/realtests/webdav.sh target/debug/loghaven /tmp/big.parquet

  chains:
    name: Chains
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      - name: Ethereum (Anvil)
        run: scripts/realtests/ethereum.sh target/debug/loghaven
      - name: Stellar (quickstart)
        run: scripts/realtests/stellar.sh target/debug/loghaven
      - name: Solana image
        run: podman build --platform linux/amd64 -t lh-solana-test:2.3.13 -f scripts/realtests/solana.Containerfile .
      - name: Solana (test validator)
        run: scripts/realtests/solana.sh target/debug/loghaven
